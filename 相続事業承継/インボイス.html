<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インボイス制度：取引の流れと最終収支の計算</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    Babel.registerPreset('tsx', {
      presets: [
        [Babel.availablePresets['typescript'], { isTSX: true, allExtensions: true }],
        Babel.availablePresets['react']
      ]
    });
  </script>
  
  <style>
    .scrollbar-hide::-webkit-scrollbar { height: 10px; }
    .scrollbar-hide::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 5px; }
    .scrollbar-hide::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
    svg { overflow: visible; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-presets="tsx">
    const { useState } = React;

    const formatCurrency = (amount: number) => new Intl.NumberFormat('ja-JP').format(amount);

    // --- コンポーネント：事業者・消費者ボックス ---
    const EntityBox = ({ 
      name, role, icon, 
      taxCollected, taxPaid, taxDeductible, taxToPay, 
      salesTotal, purchaseTotal,
      isExempt, isConsumer, highlightDeduction 
    }: any) => {
      // 収支計算式: 入金(売上合計) - 出金(仕入合計) - 納税額 = 最終収支
      const income = salesTotal || 0;
      const expense = purchaseTotal || 0;
      const tax = taxToPay || 0;
      const netProfit = isConsumer ? -income : income - expense - tax;

      return (
        <div className={`relative w-[215px] bg-white rounded-2xl shadow-md border-t-4 flex flex-col overflow-hidden ${isConsumer ? 'border-pink-400' : isExempt ? 'border-amber-400' : 'border-blue-500'}`}>
          <div className="pt-4 pb-2 text-center">
            <div className="text-4xl mb-1">{icon}</div>
            <div className="font-black text-base">{name}</div>
            <div className="text-[10px] text-slate-500 font-bold">{role}</div>
            {isExempt && (
              <div className="mt-1 bg-amber-100 text-amber-800 text-[9px] font-bold px-2 py-0.5 rounded-full inline-block">
                免税事業者
              </div>
            )}
          </div>

          <div className="px-3 py-2 space-y-2 flex-grow bg-slate-50/50">
            {/* 消費税の内訳 */}
            {!isConsumer && (
              <div className="bg-white p-2 rounded-lg border border-slate-200 shadow-sm text-[10px]">
                <div className="flex justify-between text-blue-700">
                  <span>預かった税</span>
                  <span>+{formatCurrency(taxCollected)}</span>
                </div>
                {purchaseTotal !== undefined && (
                  <div className={`flex justify-between mt-1 pt-1 border-t border-dashed ${highlightDeduction ? 'text-rose-600 font-bold' : 'text-slate-500'}`}>
                    <span>控除できる税</span>
                    <span>-{formatCurrency(taxDeductible)}</span>
                  </div>
                )}
                <div className="flex justify-between font-bold mt-1 text-green-700 pt-1 border-t">
                  <span>国への納税</span>
                  <span>{formatCurrency(taxToPay)}</span>
                </div>
              </div>
            )}

            {isConsumer && (
              <div className="bg-white p-2 rounded-lg border border-pink-200 text-[10px] text-center">
                <span className="text-pink-600 font-bold block">負担する消費税</span>
                <span className="text-sm font-black">{formatCurrency(taxCollected)}円</span>
              </div>
            )}

            {/* 収支計算式（今回のメイン） */}
            <div className={`p-2 rounded-lg border-2 ${isConsumer ? 'border-pink-200 bg-pink-50' : isExempt ? 'border-amber-200 bg-amber-50' : 'border-blue-200 bg-blue-50'}`}>
              <div className="text-[9px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">収支計算 (入金-出金-納税)</div>
              <div className="text-[10px] space-y-0.5">
                <div className="flex justify-between">
                  <span>{isConsumer ? '収入' : '入金(売上)'}</span>
                  <span className="text-slate-700">{formatCurrency(income)}</span>
                </div>
                <div className="flex justify-between">
                  <span>{isConsumer ? '支出(税込)' : '出金(仕入)'}</span>
                  <span className="text-slate-700">▲{formatCurrency(expense)}</span>
                </div>
                {!isConsumer && (
                  <div className={`flex justify-between ${tax > 0 ? 'text-green-700 font-medium' : ''}`}>
                    <span>納税額</span>
                    <span>▲{formatCurrency(tax)}</span>
                  </div>
                )}
              </div>
            </div>

            {/* 最終利益 */}
            <div className={`p-2 rounded-lg text-white ${isConsumer ? 'bg-pink-500' : isExempt ? 'bg-amber-500' : 'bg-blue-600'}`}>
              <div className="flex justify-between items-center">
                <span className="text-[10px] font-bold">最終収支</span>
                <span className="text-sm font-black">{formatCurrency(netProfit)}円</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const TransactionBox = ({ productName, price, tax, isExempt }: any) => (
      <div className="relative w-[120px] h-full flex flex-col items-center justify-center pt-10">
        <div className="mb-2 text-center z-10">
          <div className="text-[10px] font-bold bg-white border border-slate-300 px-2 py-0.5 rounded-full shadow-sm mb-1 text-slate-600">
            {productName}
          </div>
          <div className="bg-slate-800 text-white rounded p-1 shadow-md">
             <div className="text-[10px] font-black">{formatCurrency(price + tax)}円</div>
             <div className="text-[8px] opacity-70">(うち税 {formatCurrency(tax)})</div>
          </div>
        </div>
        <div className="w-full flex items-center px-1">
          <div className="h-[2px] bg-slate-400 w-full"></div>
          <div className="w-2 h-2 border-t-2 border-r-2 border-slate-400 rotate-45 -ml-1.5"></div>
        </div>
        <svg className="absolute top-0 left-0 w-full h-full pointer-events-none" style={{zIndex: 0}}>
           <path d="M 0,135 Q 60,110 120,135" fill="none" stroke={isExempt ? "#fbbf24" : "#3b82f6"} strokeWidth="2" strokeDasharray="4" />
        </svg>
      </div>
    );

    const App = () => {
      const [isAExempt, setIsAExempt] = useState(true);

      const taxRate = 0.1;
      const aSales = 10000; const aTax = aSales * taxRate;
      const bSales = 30000; const bTax = bSales * taxRate;
      const cSales = 50000; const cTax = cSales * taxRate;

      const aTaxToPay = isAExempt ? 0 : aTax;
      const bTaxDeductible = isAExempt ? 0 : aTax;
      const bTaxToPay = bTax - bTaxDeductible;
      const cTaxToPay = cTax - bTax; // Bは登録済
      
      const totalTaxRevenue = aTaxToPay + bTaxToPay + cTaxToPay;

      return (
        <div className="max-w-6xl mx-auto pb-10">
          <div className="bg-white rounded-3xl shadow-sm p-6 md:p-8 mb-8 border border-slate-200">
            <h1 className="text-2xl md:text-3xl font-black text-slate-800 mb-6">
              インボイス制度：取引リレーと「収支」の変化
            </h1>

            {/* Tips：用語と計算式の解説 */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
              <div className="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-xl">
                <h3 className="font-bold text-indigo-900 text-sm mb-1">💡 仕入税額控除（計算のルール）</h3>
                <p className="text-[11px] text-indigo-800 leading-relaxed">
                  <strong>自分が顧客から預かった消費税</strong>から、<strong>自分が仕入先に支払った消費税</strong>を差し引くこと。この「引き算」のおかげで、事業者は利益（付加価値）に対する税金だけを納めれば済みます。
                </p>
              </div>
              <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl">
                <h3 className="font-bold text-amber-900 text-sm mb-1">⚠️ 免税事業者と収支の関係</h3>
                <p className="text-[11px] text-amber-800 leading-relaxed">
                  免税事業者は「預かった税」を納めなくて良いため収支が増えます（<strong>益税</strong>）。一方で、買い手（B社）はインボイスがないと「引き算」ができず、納税額がその分増えてしまい、収支が悪化します。
                </p>
              </div>
            </div>

            {/* モード切替 */}
            <div className="bg-slate-100 p-4 rounded-2xl border-2 border-slate-200 flex flex-col md:flex-row items-center justify-center gap-6">
              <div className={`text-center md:text-right flex-1 transition-opacity ${!isAExempt ? 'opacity-100' : 'opacity-40'}`}>
                <div className="font-black text-lg text-blue-600">A社：登録事業者</div>
                <p className="text-[10px] text-slate-500">B社は1,000円をマイナス(控除)できる</p>
              </div>
              <button 
                className={`relative inline-flex h-10 w-20 items-center rounded-full transition-colors shadow-inner flex-shrink-0 ${isAExempt ? 'bg-amber-500' : 'bg-blue-600'}`}
                onClick={() => setIsAExempt(!isAExempt)}
              >
                <span className={`inline-block h-8 w-8 transform rounded-full bg-white shadow transition-transform duration-300 ${isAExempt ? 'translate-x-11' : 'translate-x-1'}`} />
              </button>
              <div className={`text-center md:text-left flex-1 transition-opacity ${isAExempt ? 'opacity-100' : 'opacity-40'}`}>
                <div className="font-black text-lg text-amber-600">A社：免税事業者</div>
                <p className="text-[10px] text-slate-500">B社は控除できず、<span className="text-rose-600 font-bold">納税額が1,000円増える</span></p>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl shadow-xl p-6 overflow-x-auto scrollbar-hide border border-slate-200">
            <div className="min-w-max flex flex-col items-center">
              
              <div className="flex items-start">
                <EntityBox 
                  name="A社" role="仕入先(部品)" icon="👨‍🔧"
                  taxCollected={aTax} taxToPay={aTaxToPay} 
                  salesTotal={aSales+aTax} isExempt={isAExempt}
                />
                
                <TransactionBox productName="取引①" price={aSales} tax={aTax} isExempt={isAExempt} />
                
                <EntityBox 
                  name="B社" role="製造メーカー" icon="🏭"
                  taxCollected={bTax} taxPaid={aTax} taxDeductible={bTaxDeductible} taxToPay={bTaxToPay}
                  salesTotal={bSales+bTax} purchaseTotal={aSales+aTax}
                  highlightDeduction={isAExempt}
                />

                <TransactionBox productName="取引②" price={bSales} tax={bTax} />

                <EntityBox 
                  name="C社" role="小売店" icon="🏪"
                  taxCollected={cTax} taxPaid={bTax} taxDeductible={bTax} taxToPay={cTaxToPay}
                  salesTotal={cSales+cTax} purchaseTotal={bSales+bTax}
                />

                <TransactionBox productName="最終販売" price={cSales} tax={cTax} />

                <EntityBox 
                  name="消費者" role="最終負担者" icon="🛒"
                  taxCollected={cTax} salesTotal={0} purchaseTotal={cSales+cTax} isConsumer
                />
              </div>

              {/* 税務署合計 */}
              <div className="mt-10 w-full max-w-4xl bg-gradient-to-br from-green-50 to-green-100 border-2 border-green-300 rounded-2xl p-6 shadow-sm text-center">
                <div className="text-xs font-black text-green-700 mb-2 uppercase">Total Tax Collected / 納税合計</div>
                <div className="text-4xl font-black text-green-800">
                  {formatCurrency(totalTaxRevenue)} <span className="text-xl">円</span>
                </div>
                <p className="text-[11px] text-green-700 mt-2">
                  消費者が負担した5,000円が、各社に分担されて国に納められました。
                </p>
              </div>

            </div>
          </div>

          <footer className="mt-6 text-[10px] text-slate-400 text-center">
            ※各事業者の最終収支は、売上総利益から消費税の納税義務分を加味した実質的な手残り額を示しています。
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
